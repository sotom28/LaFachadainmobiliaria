# de forma local, sin docker

spring.application.name=LaFachada
server.port=8004

# Configuración de MariaDB
spring.datasource.url=jdbc:mariadb://localhost:3306/lafachada?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=1234
# CORRECCIÓN: guiones en lugar de camelCase para el driver
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# CORRECCIÓN: propiedad moderna para el dialecto en Spring Boot 3
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# Configuración estética opcional
spring.boot.ansi.filename-variable-enabled=always



