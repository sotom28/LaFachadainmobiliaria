spring.datasource.url=jdbc:mariadb://${DB_HOST}:${DB_PORT}/${DB_NAME}?createDatabaseIfNotExist=true&sslMode=trust
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Configuración Hibernate JPA (Generación Forzada)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# Ignorar metadatos iniciales para evitar el bloqueo de inicialización
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
# Crear la base de datos de forma lógica en la sesión de conexión si no existe
spring.jpa.properties.hibernate.connection.init=CREATE DATABASE IF NOT EXISTS publicaciondb;

# Variables de entorno de AWS
aws.access.key.id=${AWS_ACCESS_KEY_ID}
aws.secret.access.key=${AWS_SECRET_ACCESS_KEY}
aws.session.token=${AWS_SESSION_TOKEN}
aws.region=${AWS_REGION}
AWS_S3_BUCKET=${AWS_S3_BUCKET_NAME}



